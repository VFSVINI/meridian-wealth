version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [infra]
    commit-message:
      prefix: "build"
    # Majors do Spring Boot e a distribuição do Maven do wrapper (fixada por checksum) mudam por decisão
    # manual, em PR próprio com migração; o Dependabot não as propõe.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      plugins-qualidade:
        patterns: ["com.diffplug.spotless*", "com.puppycrawl.tools*", "org.jacoco*", "org.apache.maven.plugins*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [infra]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [infra]
    # O projeto fixa o Java 21 (LTS): o JDK das imagens muda só por decisão manual.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
        versions: ["3.9-eclipse-temurin-22", "3.9-eclipse-temurin-23", "3.9-eclipse-temurin-24", "3.9-eclipse-temurin-25", "3.9-eclipse-temurin-26", "3.9-eclipse-temurin-27"]
    commit-message:
      prefix: "build"
