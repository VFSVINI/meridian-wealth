name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, testes, cobertura e estilo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: mvn verify (JUnit, JaCoCo, Checkstyle e Spotless)
        run: ./mvnw -B verify
      - name: Publica o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de linhas: %.1f%% (%d de %d)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
  docker:
    name: Compose e imagem Docker
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Valida o Compose
        run: docker compose config -q
      - name: Build da imagem
        run: docker build -t meridian-wealth:ci .
