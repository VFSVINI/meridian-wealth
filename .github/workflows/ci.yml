name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, testes, cobertura e estilo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: mvn verify (JUnit, JaCoCo, Checkstyle e Spotless)
        run: ./mvnw -B verify
      - name: Persistência contra PostgreSQL 16 real em contêiner (Testcontainers)
        # os contratos de persistência, a migração V3 e a aplicação inteira com banco, agora no PostgreSQL do contêiner em vez do binário embutido:
        # prova que a concorrência e a idempotência valem fora do embutido (o verify acima já rodou tudo no embutido)
        run: ./mvnw -B test -Dmw.test.postgres=container -Dtest='Jdbc*Test,MigrationV3Test,PortfolioPostgresIntegrationTest'
      - name: Publica o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de linhas: %.1f%% (%d de %d)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
  docker:
    name: Compose e imagem Docker
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Valida o Compose
        run: docker compose config -q
      - name: Valida a pilha de observabilidade (Compose, configuração e regras do Prometheus)
        run: |
          mkdir -p ops/observability/secrets
          echo "token-de-teste-da-ci-com-mais-de-24-caracteres" > ops/observability/secrets/metrics-token
          docker compose -f ops/observability/docker-compose.yml config -q
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "$PWD/ops/observability/secrets/metrics-token:/etc/prometheus/metrics-token:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Build da imagem
        run: docker build -t meridian-wealth:ci .
  mutation:
    name: Teste de mutação (PIT, domínio)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: PIT sobre o domínio (falha abaixo da meta de mutação do pom.xml)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Publica o relatório de mutação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit
          path: target/pit-reports
          if-no-files-found: ignore
