name: dependency-review
# Revisão de dependências em todo PR: bloqueia a entrada de dependência com vulnerabilidade conhecida de severidade alta ou crítica.
# (Complementa o Dependabot, que propõe as atualizações, e o CodeQL, que analisa o código.)
# Exige o "Dependency graph" ligado nas configurações do repositório (Settings > Code security). Enquanto estiver desligado, a etapa
# reporta o erro sem bloquear o PR (continue-on-error); depois de ligar, remova essa linha para a revisão passar a bloquear.
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    name: Revisão de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
