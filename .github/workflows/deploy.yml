name: deploy

# Deploy sob comando: o Render continua com autoDeploy desligado (render.yaml), então nada é publicado a cada push.
# Este fluxo roda quando o dono manda (Actions > deploy > Run workflow) ou quando uma release é publicada. Ele:
#   1. confirma que a CI passou no commit;
#   2. publica a imagem no GitHub Container Registry (ghcr.io), marcada com o commit;
#   3. aciona o deploy hook do Render e espera o serviço responder (/actuator/info) com ESSE commit.
# Configuração (uma vez, em Settings > Secrets and variables > Actions): o segredo RENDER_DEPLOY_HOOK_URL e a variável RENDER_SERVICE_URL.
# Passo a passo e o que não foi validado: docs/deploy.md.
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Confirma a CI e publica a imagem no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirma que a CI passou neste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Build, testes, cobertura e estilo") | .conclusion] | first')
          echo "Resultado da CI em ${{ github.sha }}: ${result:-nenhum}"
          if [ "$result" != "success" ]; then
            echo "::error::A CI não passou (ou não rodou) neste commit. Nada foi publicado."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagem em minúsculas (o GHCR exige)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Aciona o Render e confere o commit no ar
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Confere a configuração
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$URL" ]; then
            echo "::error::Faltam o segredo RENDER_DEPLOY_HOOK_URL e/ou a variável RENDER_SERVICE_URL (Settings > Secrets and variables > Actions). Veja docs/deploy.md."
            exit 1
          fi
      - name: Aciona o deploy hook do Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "::add-mask::$HOOK"
          curl -fsS -m 30 -X POST "$HOOK" > /dev/null
          echo "Deploy pedido ao Render."
      - name: Espera o serviço subir neste commit
        env:
          URL: ${{ vars.RENDER_SERVICE_URL }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS -m 25 "${URL%/}/actuator/info" 2>/dev/null || true)
            if echo "$body" | grep -q "$SHA"; then
              echo "No ar com o commit $SHA (tentativa $i)."
              curl -fsS -m 25 "${URL%/}/actuator/health/liveness"
              echo
              exit 0
            fi
            echo "Tentativa $i: ainda não está no commit $SHA."
            sleep 15
          done
          echo "::error::O serviço não respondeu com o commit $SHA em 15 minutos. Veja o painel do Render."
          exit 1
