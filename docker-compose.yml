services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meridianwealth
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridianwealth"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  meridianwealth:
    build: .
    image: meridian-wealth:0.1.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MW_EXCLUDE_AUTOCONFIG: ""
      MW_PERSISTENCE: "true"
      MW_CACHE_TYPE: redis
      DB_URL: jdbc:postgresql://postgres:5432/meridianwealth
      DB_USER: meridian
      DB_PASSWORD: meridian
      REDIS_HOST: redis
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MW_JWT_SECRET: ${MW_JWT_SECRET:-}
      MW_GOOGLE_CLIENT_ID: ${MW_GOOGLE_CLIENT_ID:-}
      MW_TRUSTED_PROXIES: ${MW_TRUSTED_PROXIES:-}
      MW_CORS_ORIGINS: ${MW_CORS_ORIGINS:-}
      MW_DEMO_MODE: ${MW_DEMO_MODE:-true}
    restart: unless-stopped
volumes:
  pgdata:
