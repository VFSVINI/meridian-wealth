services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronosquant
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronosquant"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  chronosquant:
    build: .
    image: chronosquant:0.2.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CQ_EXCLUDE_AUTOCONFIG: ""
      CQ_PERSISTENCE: "true"
      CQ_CACHE_TYPE: redis
      CQ_DATA_MODE: ${CQ_DATA_MODE:-auto}
      DB_URL: jdbc:postgresql://postgres:5432/chronosquant
      DB_USER: chronos
      DB_PASSWORD: chronos
      REDIS_HOST: redis
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
    restart: unless-stopped
volumes:
  pgdata:
