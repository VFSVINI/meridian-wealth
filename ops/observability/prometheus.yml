global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: meridianwealth
    metrics_path: /actuator/prometheus
    # o endpoint exige "Authorization: Bearer <MW_METRICS_TOKEN>" (ActuatorAccessFilter); o token fica num arquivo, nunca neste arquivo
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # a aplicação rodando na sua máquina (./mvnw spring-boot:run); para a imagem Docker do compose do projeto, troque por meridianwealth:8080 na mesma rede
      - targets: ["host.docker.internal:8080"]
