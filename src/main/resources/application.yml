spring:
  application:
    name: meridianwealth
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  # Sem Docker: Postgres e Redis ficam fora. No Compose, MW_EXCLUDE_AUTOCONFIG vazio liga ambos.
  autoconfigure:
    exclude: ${MW_EXCLUDE_AUTOCONFIG:org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meridianwealth}
    username: ${DB_USER:meridian}
    password: ${DB_PASSWORD:meridian}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
meridianwealth:
  data:
    mode: ${MW_DATA_MODE:auto}          # auto = provedores reais com fallback simulado | simulated
    history-bars: 500
    poll-open-seconds: 30
    poll-closed-seconds: 600
  finnhub:
    api-key: ${FINNHUB_API_KEY:}
  fred:
    api-key: ${FRED_API_KEY:}
  stream:
    flow-default: true
  cache:
    type: ${MW_CACHE_TYPE:memory}        # memory | redis
    quote-ttl-seconds: 25
  persistence:
    enabled: ${MW_PERSISTENCE:false}
  rate-limit:
    api-per-minute: 300
