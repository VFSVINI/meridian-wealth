spring:
  application:
    name: meridianwealth
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  # Sem Docker: Postgres e Redis ficam fora. No Compose, MW_EXCLUDE_AUTOCONFIG vazio liga ambos.
  autoconfigure:
    exclude: ${MW_EXCLUDE_AUTOCONFIG:org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meridianwealth}
    username: ${DB_USER:meridian}
    password: ${DB_PASSWORD:meridian}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
meridianwealth:
  data:
    history-bars: 500
    poll-open-seconds: 30
    poll-closed-seconds: 600
  finnhub:
    api-key: ${FINNHUB_API_KEY:}
    websocket: ${MW_FINNHUB_WS:true}       # WebSocket de negócios (só com chave)
  crypto:
    stream:
      enabled: ${MW_CRYPTO_STREAM:true}   # WebSocket Binance com failover Coinbase e Kraken
  paid-feed:
    provider: ${MW_PAID_FEED:none}         # none | twelvedata (desligado por padrão)
    api-key: ${MW_PAID_FEED_KEY:}
    freshness: ${MW_PAID_FEED_FRESHNESS:DELAYED}  # selo do plano: REAL_TIME | DELAYED
  fred:
    api-key: ${FRED_API_KEY:}
  brapi:
    token: ${MW_BRAPI_TOKEN:}         # opcional: sem token só PETR4, VALE3, ITUB4 e MGLU3
  stooq:
    enabled: ${MW_STOOQ_ENABLED:false} # exige verificação JavaScript desde 2026-11
  cache:
    type: ${MW_CACHE_TYPE:memory}        # memory | redis
    quote-ttl-seconds: 25
  persistence:
    enabled: ${MW_PERSISTENCE:false}
  rate-limit:
    api-per-minute: 300        # anônimo, por IP real do cliente
    user-per-minute: 600       # autenticado, por usuário
    demo-per-minute: 120       # sessão de demonstração, por sessão
    auth-per-minute: 20        # rotas /api/auth/*, por IP (segura força bruta)
  security:
    jwt-secret: ${MW_JWT_SECRET:}                   # mínimo 32 caracteres; vazio = segredo aleatório a cada partida
    bcrypt-strength: ${MW_BCRYPT_STRENGTH:12}
    trusted-proxies: ${MW_TRUSTED_PROXIES:}         # IPs ou CIDR de proxies cujo X-Forwarded-For vale (vazio = ignorar o cabeçalho)
    cors-allowed-origins: ${MW_CORS_ORIGINS:}       # origens exatas separadas por vírgula (vazio = só a própria origem)
  auth:
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    demo-ttl-minutes: 60
    max-users: 10000
    max-demo-users: 500
    demo-enabled: ${MW_DEMO_MODE:true}
    registration-enabled: ${MW_REGISTRATION:true}
    login-max-failures: 5            # por e-mail
    login-max-failures-per-ip: 50    # por IP (bem mais folgado: NAT e proxy fazem muita gente dividir um IP)
    login-window-minutes: 15
  google:
    client-id: ${MW_GOOGLE_CLIENT_ID:}              # vazio = Login com Google desligado (a aplicação sobe normalmente)
